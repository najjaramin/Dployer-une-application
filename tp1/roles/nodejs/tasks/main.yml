---
- name: Create APT keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download NodeSource signing key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    owner: root
    group: root
    mode: "0644"

- name: Configure NodeSource repository
  ansible.builtin.deb822_repository:
    name: nodesource
    types:
      - deb
    uris:
      - "https://deb.nodesource.com/node_{{ nodejs_major_version }}.x"
    suites:
      - nodistro
    components:
      - main
    signed_by: /etc/apt/keyrings/nodesource.asc
    state: present
  register: nodesource_repo

- name: Refresh APT cache after repository change
  ansible.builtin.apt:
    update_cache: true
  when: nodesource_repo.changed

- name: Install Node.js and npm
  ansible.builtin.apt:
    name: nodejs
    state: present

- name: Install PM2 globally
  ansible.builtin.command:
    argv:
      - npm
      - install
      - --global
      - pm2
    creates: /usr/bin/pm2
